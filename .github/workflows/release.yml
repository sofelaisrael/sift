name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lib/config.dart is gitignored (holds personal API keys). CI builds from
      # the committed template, so the app compiles without any real keys.
      - name: Prepare config for CI
        run: cp lib/config.example.dart lib/config.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release
        # Release is signed with the debug key (android/app/build.gradle.kts),
        # which is fine for sideloading from GitHub Releases. To publish on the
        # Play Store later: generate a keystore, store it + passwords as repo
        # secrets, and wire signingConfigs.release in build.gradle.kts.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
