workflows:
  screensort-android:
    name: ScreenSort Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Setup
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --verbose
      - name: Find APK
        script: find build -name "*.apk" 2>/dev/null; find android -name "*.apk" 2>/dev/null; ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No APK output directory found"
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
