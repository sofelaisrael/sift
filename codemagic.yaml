workflows:
  screensort-android:
    name: ScreenSort Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Setup
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
      - name: Verify APK
        script: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f
          echo "=== build/app/outputs contents ==="
          ls -laR build/app/outputs/ 2>/dev/null || echo "Directory not found"
    artifacts:
      - build/**/*.apk
      - build/**/*.aab
      - android/app/build/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
