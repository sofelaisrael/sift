workflows:
  sift-android:
    name: Sift Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Generate config
        script: |
          cat > lib/config.dart << ENDCONFIG
          class AppConfig {
            static const String groqApiKey = '$GROQ_API_KEY';
            static const String geminiApiKey = '$GEMINI_API_KEY';
            static const String cerebrasApiKey = '$CEREBRAS_API_KEY';
            static const String openRouterApiKey = '$OPENROUTER_API_KEY';
            static const String defaultProvider = 'Google Gemini';
            static const String appName = 'Sift';
          }
          ENDCONFIG
          cat lib/config.dart
      - name: Install dependencies
        script: flutter pub get
      - name: Clean Gradle cache
        script: cd android && ./gradlew clean 2>/dev/null || true
      - name: Stop old Gradle daemons
        script: cd android && ./gradlew --stop 2>/dev/null || true
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/*.apk
      - build/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com