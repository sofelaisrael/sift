workflows:
  screensort-android:
    name: ScreenSort Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Setup
        script: |
          export JAVA_HOME=/Applications/Android\ Studio.app/Contents/jbr/Contents/Home
          flutter pub get
      - name: Build APK
        script: |
          export JAVA_HOME=/Applications/Android\ Studio.app/Contents/jbr/Contents/Home
          flutter build apk --release --verbose 2>&1 | tee /tmp/full_build.log
      - name: Dump errors
        script: |
          echo "=== WHAT WENT WRONG ==="
          grep -B2 -A10 "What went wrong" /tmp/full_build.log || echo "Not found"
          echo "=== LAST 30 LINES ==="
          tail -30 /tmp/full_build.log
    artifacts:
      - /tmp/full_build.log
      - build/**/*.apk
      - build/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
