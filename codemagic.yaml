workflows:
  sift-android:
    name: Sift Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Prepare build config
        script: |
          # lib/config.dart is gitignored and must never carry release secrets.
          # The committed template holds non-secret metadata only (app name and
          # the default chat provider), so CI copies it verbatim. Provider and
          # YouTube keys are never read here and never reach the APK: cloud
          # chat and source lookup run only against a key the user saves in
          # Settings.
          cp lib/config.example.dart lib/config.dart
      - name: Install dependencies
        script: flutter pub get
      - name: Clean Gradle cache
        script: cd android && ./gradlew clean 2>/dev/null || true
      - name: Stop old Gradle daemons
        script: cd android && ./gradlew --stop 2>/dev/null || true
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/*.apk
      - build/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com