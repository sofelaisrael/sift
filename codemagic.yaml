workflows:
  screensort-android:
    name: ScreenSort Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Setup
        script: |
          cat > lib/config.dart << EOF
          class AppConfig {
            static const String openRouterApiKey = '$OPENROUTER_API_KEY';
            static const String openRouterModel = '$OPENROUTER_MODEL';
            static const String appName = '$APP_NAME';
          }
          EOF
          flutter pub get
      - name: Kill old Gradle daemons
        script: |
          cd android && ./gradlew --stop 2>/dev/null || true
      - name: Build APK
        script: |
          flutter build apk --release --verbose 2>&1 | tee /tmp/full_build.log
      - name: Dump errors
        script: |
          echo "=== WHAT WENT WRONG ==="
          grep -B2 -A10 "What went wrong" /tmp/full_build.log || echo "Not found"
          echo "=== LAST 30 LINES ==="
          tail -30 /tmp/full_build.log
    artifacts:
      - /tmp/full_build.log
      - build/**/*.apk
      - build/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
