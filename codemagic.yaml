workflows:
  screensort-android:
    name: ScreenSort Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
    scripts:
      - name: Generate config
        script: |
          cat > lib/config.dart << ENDCONFIG
          class AppConfig {
            static const String openRouterApiKey = '${OPENROUTER_API_KEY}';
            static const String openRouterModel = '${OPENROUTER_MODEL}';
            static const String appName = '${APP_NAME}';
          }
          ENDCONFIG
          cat lib/config.dart
      - name: Install dependencies
        script: flutter pub get
      - name: Stop old Gradle daemons
        script: cd android && ./gradlew --stop 2>/dev/null || true
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/*.apk
      - build/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
