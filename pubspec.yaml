name: screensort_lam
description: Screenshot → AI understands → Takes action (Calendar, Reminders, Shopping)

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # OCR - ML Kit
  google_mlkit_text_recognition: ^0.16.0

  # Calendar integration
  add_2_calendar: ^3.1.1
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Notifications
  flutter_local_notifications: ^22.0.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # State management
  provider: ^6.1.1
  
  # Date formatting
  intl: ^0.19.0

  # UUID
  uuid: ^4.2.1

  # HTTP (for OpenRouter API)
  http: ^1.2.1

  # Image picker
  image_picker: ^1.0.7

  # Timezone (for scheduled notifications)
  timezone: ^0.11.0

  # Shared preferences (for onboarding state)
  shared_preferences: ^2.2.2

  # Open web links in the browser
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4VF.ttf
        - asset: assets/fonts/SourceSerif4-ItalicVF.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoVF.ttf
