name: screensort_lam
description: Screenshot → AI understands → Takes action (Calendar, Reminders, Shopping)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # OCR - ML Kit
  google_mlkit_text_recognition: ^0.11.0

  # Calendar integration
  device_calendar: ^4.0.0
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # State management
  provider: ^6.1.1
  
  # Date formatting
  intl: ^0.19.0

  # UUID
  uuid: ^4.2.1

  # HTTP (for OpenRouter API)
  http: ^1.2.1

  # Image picker
  image_picker: ^1.0.7

  # Timezone (for scheduled notifications)
  timezone: ^0.9.2

dev_dependencies:
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
